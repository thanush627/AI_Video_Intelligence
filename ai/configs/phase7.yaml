# Phase 7: LangGraph Hybrid Retrieval & Clip Generation Configuration

retrieval:
  top_k_sql: 20
  top_k_vector: 20
  final_top_k: 5
  rrf_k: 60  # Reciprocal Rank Fusion constant
  weights:
    sql: 0.5
    vector: 0.5

llm:
  model_name: "gpt-4o-mini"  # or local Qwen model / Ollama endpoint
  temperature: 0.1

database:
  postgres:
    table_name: "events"
  chromadb:
    collection_name: "video_events"

clip_generation:
  output_dir: "uploads/clips"
  padding_seconds: 2.0  # Buffer added before and after event timestamp
  ffmpeg_preset: "fast"